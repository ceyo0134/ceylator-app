name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -nE "error:|What went wrong|FAILED|Execution failed|Caused by|not found|No such|undefined reference" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            tail -n 12 build.log | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: Ceylator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
