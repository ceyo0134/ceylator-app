name: Build APK

on:
  push:
    branches: [ui-redesign, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: NDK, CMake, platform
        run: |
          set -o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee sdk.log | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Report SDK failure
        if: failure()
        run: echo "::error title=SDK step::$(tail -n 20 sdk.log 2>/dev/null | tr '\n' ' ' | cut -c1-1500)"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          grep -n -E "error:|FAILED|What went wrong|Execution failed|Caused by|rror" build.log 2>/dev/null | head -25 | cut -c1-300 | while IFS= read -r l; do echo "::error title=Build::$l"; done

      - name: Pack into a single maximally compressed zip
        run: |
          set -e
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$APK" "dist/Ceylator-$SHORT.apk"
          cd dist
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip -mx=9 -mm=Deflate -mfb=258 -mpass=15 "../Ceylator-$SHORT.zip" "Ceylator-$SHORT.apk"
          else
            zip -9 -X "../Ceylator-$SHORT.zip" "Ceylator-$SHORT.apk"
          fi
          cd ..
          ls -lh "dist/Ceylator-$SHORT.apk" "Ceylator-$SHORT.zip"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - name: Upload artifact (already zipped, so no second compression)
        uses: actions/upload-artifact@v4
        with:
          name: Ceylator-${{ env.SHORT }}
          path: Ceylator-${{ env.SHORT }}.zip
          compression-level: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT}"
          gh release create "$TAG" "Ceylator-${SHORT}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ceylator build ${GITHUB_RUN_NUMBER} (${SHORT})" \
            --notes "Debug APK, packed in a single zip."
